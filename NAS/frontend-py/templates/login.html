<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaultix NAS — 登入</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="card">
    <h1 class="logo">Vaultix<span>NAS</span></h1>

    <!-- Step 1: credentials -->
    <form id="loginForm" class="step">
      <label>帳號 / Username
        <input id="username" name="username" autocomplete="username" required autofocus />
      </label>
      <label>密碼 / Password
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit" id="loginBtn">登入 / Sign in</button>
    </form>

    <!-- Step 2: 2FA (hidden until required) -->
    <form id="twofaForm" class="step hidden">
      <p class="hint">請輸入驗證器的 6 位數碼<br/>Enter the 6-digit code</p>
      <label>驗證碼 / Code
        <input id="code" inputmode="numeric" maxlength="7" placeholder="000000" autocomplete="one-time-code" />
      </label>
      <button type="submit" id="twofaBtn">驗證 / Verify</button>
      <button type="button" id="backBtn" class="link">← 返回 / Back</button>
    </form>

    <p id="error" class="error hidden"></p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const errEl = $("error");
    let twofa = { mode: null, tempToken: null, ticket: null };

    function showError(msg) { errEl.textContent = msg; errEl.classList.remove("hidden"); }
    function clearError() { errEl.classList.add("hidden"); errEl.textContent = ""; }

    async function postJSON(url, body) {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRF": "1" },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data;
    }

    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();
      $("loginBtn").disabled = true;
      try {
        const data = await postJSON("/api/login", {
          username: $("username").value.trim(),
          password: $("password").value,
        });
        if (data.requiresTwoFactor) {
          twofa = { mode: data.method || "node", tempToken: data.tempToken, ticket: data.ticket };
          $("loginForm").classList.add("hidden");
          $("twofaForm").classList.remove("hidden");
          $("code").focus();
        } else {
          location.href = data.next || "/home";
        }
      } catch (err) {
        showError(err.message);
      } finally {
        $("loginBtn").disabled = false;
      }
    });

    $("twofaForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();
      $("twofaBtn").disabled = true;
      try {
        const code = $("code").value.replace(/\s/g, "");
        const data = twofa.mode === "python"
          ? await postJSON("/api/2fa/totp/login", { ticket: twofa.ticket, code })
          : await postJSON("/api/2fa/verify", { tempToken: twofa.tempToken, code });
        location.href = data.next || "/home";
      } catch (err) {
        showError(err.message);
      } finally {
        $("twofaBtn").disabled = false;
      }
    });

    $("backBtn").addEventListener("click", () => {
      clearError();
      twofa = { mode: null, tempToken: null, ticket: null };
      $("twofaForm").classList.add("hidden");
      $("loginForm").classList.remove("hidden");
      $("username").focus();
    });
  </script>
</body>
</html>
