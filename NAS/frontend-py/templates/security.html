<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaultix NAS — 安全性 / Security</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="card" style="max-width:420px">
    <h1 class="logo">Vaultix<span>NAS</span></h1>
    <p class="hint">兩步驗證 / Two-Factor · <strong>{{ username }}</strong></p>

    <div id="status" class="hint" style="margin:12px 0">載入中…</div>

    <!-- TOTP enrollment -->
    <div class="step">
      <button id="setupBtn" type="button">設定 TOTP / QR Code</button>

      <div id="qrBox" class="hidden" style="text-align:center">
        <p class="hint">用驗證器 App 掃描,或手動輸入金鑰。<br/>QR <span id="countdown"></span> 秒後失效。</p>
        <img id="qrImg" alt="QR" style="width:180px;height:180px;background:#fff;border-radius:10px;padding:6px" />
        <p class="hint" style="word-break:break-all">金鑰:<code id="secret"></code></p>
        <label>輸入驗證碼 / Code
          <input id="code" inputmode="numeric" maxlength="7" placeholder="000000" autocomplete="one-time-code" />
        </label>
        <button id="enableBtn" type="button">啟用 / Enable</button>
      </div>

      <button id="disableBtn" type="button" class="hidden" style="background:#b91c1c">停用 TOTP / Disable</button>
    </div>

    <p id="msg" class="error hidden"></p>
    <a class="link" href="/home">← 返回 / Back</a>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let timer = null;

    function msg(text, ok) {
      const el = $("msg");
      el.textContent = text;
      el.classList.remove("hidden");
      el.style.color = ok ? "#4ade80" : "";
    }
    async function postJSON(url, body) {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRF": "1" },
        body: JSON.stringify(body || {}),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
      return d;
    }

    async function refresh() {
      try {
        const r = await fetch("/api/2fa/status");
        const s = await r.json();
        $("status").innerHTML = "TOTP:" + (s.totp ? " ✅ 已啟用" : " ⛔ 未設定")
          + " ｜ 指紋/Hello:" + (s.webauthn ? " ✅" : " ⛔");
        $("disableBtn").classList.toggle("hidden", !s.totp);
      } catch (e) { $("status").textContent = "無法讀取狀態:" + e.message; }
    }

    function startCountdown(sec) {
      clearInterval(timer);
      let left = sec;
      $("countdown").textContent = left;
      timer = setInterval(() => {
        left -= 1;
        $("countdown").textContent = left;
        if (left <= 0) { clearInterval(timer); setup(); }  // auto-refresh QR on expiry
      }, 1000);
    }

    async function setup() {
      try {
        const d = await postJSON("/api/2fa/totp/provision");
        $("qrImg").src = d.qr;
        $("secret").textContent = d.secret;
        $("qrBox").classList.remove("hidden");
        startCountdown(d.expires_in || 180);
      } catch (e) { msg(e.message, false); }
    }

    $("setupBtn").addEventListener("click", setup);

    $("enableBtn").addEventListener("click", async () => {
      try {
        await postJSON("/api/2fa/totp/enable", { code: $("code").value.replace(/\s/g, "") });
        clearInterval(timer);
        $("qrBox").classList.add("hidden");
        msg("TOTP 已啟用 ✅", true);
        refresh();
      } catch (e) { msg(e.message, false); }
    });

    $("disableBtn").addEventListener("click", async () => {
      try {
        await postJSON("/api/2fa/totp/disable");
        msg("TOTP 已停用", true);
        refresh();
      } catch (e) { msg(e.message, false); }
    });

    refresh();
  </script>
</body>
</html>
