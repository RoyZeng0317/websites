services:
  - type: web
    name: claudio-backend
    env: python
    region: singapore
    plan: free
    rootDir: Claudio/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
    autoDeploy: true
