<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LinguaPath — Vocabulary Cards</title>
  <link rel="icon" type="image/svg+xml" href="public/icons.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .vocab-header { max-width:1200px; margin:2rem auto 0; padding:0 2rem; }
    .vocab-header h1 { font-family:'Playfair Display',serif; font-size:1.8rem; margin-bottom:0.3rem; }
    .vocab-header p  { color:var(--muted); font-size:0.9rem; }

    .filter-bar {
      max-width:1200px; margin:1.2rem auto 0; padding:0 2rem;
      display:flex; flex-wrap:wrap; gap:0.7rem; align-items:center;
    }
    .filter-bar input[type="text"] {
      flex:1; min-width:180px; background:var(--surface); border:1px solid var(--border);
      border-radius:8px; padding:0.55rem 0.9rem;
      color:var(--text); font-family:'DM Sans'; font-size:0.88rem; outline:none;
    }
    .filter-bar input[type="text"]:focus { border-color:var(--accent); }
    .filter-bar select {
      background:var(--surface); border:1px solid var(--border); border-radius:8px;
      padding:0.55rem 0.8rem; color:var(--text); font-family:'DM Sans'; font-size:0.85rem;
      outline:none; cursor:pointer;
    }
    .filter-bar select:focus { border-color:var(--accent); }
    .count-label { font-size:0.82rem; color:var(--muted); }

    .card-grid {
      max-width:1200px; margin:1.5rem auto 3rem; padding:0 2rem;
      display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem;
    }

    /* Flip card */
    .flip-card { height:185px; perspective:900px; cursor:pointer; }
    .flip-card.has-image { height:240px; }
    .flip-card-inner {
      width:100%; height:100%; position:relative;
      transform-style:preserve-3d; transition:transform 0.42s cubic-bezier(.4,0,.2,1);
    }
    .flip-card.flipped .flip-card-inner { transform:rotateY(180deg); }
    .flip-front, .flip-back {
      position:absolute; width:100%; height:100%;
      backface-visibility:hidden; -webkit-backface-visibility:hidden;
      border-radius:12px; border:1px solid var(--border);
      display:flex; flex-direction:column; justify-content:flex-start;
      padding:1rem 1.2rem 0.75rem; box-shadow:0 2px 12px rgba(0,0,0,0.25);
    }
    .flip-front { background:var(--surface); }
    .flip-back  { background:var(--surface2,#1e2029); transform:rotateY(180deg); }
    .card-body  { flex:1; overflow:hidden; display:flex; flex-direction:column; }

    .card-img { width:100%; height:85px; object-fit:cover; border-radius:7px; margin-bottom:0.55rem; border:1px solid var(--border); display:block; flex-shrink:0; }
    .card-word { font-family:'Playfair Display',serif; font-size:1.5rem; font-weight:700; color:var(--text); margin-bottom:0.5rem; line-height:1.2; }
    .card-meta { display:flex; gap:0.45rem; align-items:center; flex-wrap:wrap; }

    .tag-cefr  { display:inline-block; padding:0.18rem 0.55rem; border-radius:4px; font-size:0.7rem; font-weight:700; letter-spacing:0.05em; }
    .cefr-A1 { background:rgba(126,200,160,0.15); color:#7ec8a0; border:1px solid rgba(126,200,160,0.3); }
    .cefr-A2 { background:rgba(126,200,160,0.1);  color:#9ed4b4; border:1px solid rgba(126,200,160,0.2); }
    .cefr-B1 { background:rgba(126,184,232,0.15); color:#7eb8e8; border:1px solid rgba(126,184,232,0.3); }
    .cefr-B2 { background:rgba(126,184,232,0.1);  color:#9ecce8; border:1px solid rgba(126,184,232,0.2); }
    .cefr-C1 { background:rgba(232,201,126,0.15); color:#e8c97e; border:1px solid rgba(232,201,126,0.3); }
    .cefr-C2 { background:rgba(232,126,126,0.15); color:#e87e7e; border:1px solid rgba(232,126,126,0.3); }
    .tag-pos { font-size:0.72rem; color:#7eb8e8; background:rgba(126,184,232,0.08); border:1px solid rgba(126,184,232,0.18); border-radius:4px; padding:0.15rem 0.45rem; }
    .tag-cat  { font-size:0.7rem; color:var(--muted); border:1px solid var(--border); border-radius:4px; padding:0.15rem 0.45rem; }
    .tag-exam { font-size:0.62rem; font-weight:700; letter-spacing:0.04em; border-radius:4px; padding:0.12rem 0.4rem; border:1px solid; }
    .exam-TOEIC { color:#f38ba8; border-color:rgba(243,139,168,0.4); background:rgba(243,139,168,0.1); }
    .exam-TOEFL { color:#89b4fa; border-color:rgba(137,180,250,0.4); background:rgba(137,180,250,0.1); }
    .exam-IELTS { color:#a6e3a1; border-color:rgba(166,227,161,0.4); background:rgba(166,227,161,0.1); }
    .exam-GRE   { color:#fab387; border-color:rgba(250,179,135,0.4); background:rgba(250,179,135,0.1); }

    .back-pos  { font-size:0.78rem; color:#7eb8e8; margin-bottom:0.4rem; flex-shrink:0; }
    .back-example { font-size:0.8rem; color:var(--muted); font-style:italic; line-height:1.5; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
    .back-no-ex   { font-size:0.78rem; color:var(--muted); opacity:0.45; flex:1; }

    /* Card action bar */
    .card-actions { display:flex; align-items:center; gap:0.4rem; padding-top:0.4rem; flex-shrink:0; }
    .card-actions button {
      display:flex; align-items:center; gap:0.3rem;
      background:transparent; border:1px solid var(--border); border-radius:6px;
      padding:0.25rem 0.55rem; font-size:0.72rem; color:var(--muted); cursor:pointer;
      font-family:'DM Sans',sans-serif; transition:all 0.15s;
    }
    .card-actions button:hover { color:var(--text); border-color:var(--muted); }
    .card-actions button.reading { color:#e8c97e; border-color:#e8c97e; }

    /* Self-check */
    .sc-wrap { display:flex; gap:0.3rem; margin-left:auto; }
    .sc-btn {
      background:transparent; border:1px solid var(--border); border-radius:5px;
      padding:0.18rem 0.5rem; font-size:0.82rem; cursor:pointer; color:var(--muted);
      font-family:'DM Sans',sans-serif; transition:all 0.15s; line-height:1;
    }
    .sc-btn:hover { border-color:var(--muted); color:var(--text); }
    .sc-btn.ok  { color:#7ec8a0; border-color:#7ec8a0; background:rgba(126,200,160,0.1); }
    .sc-btn.bad { color:#e87e7e; border-color:#e87e7e; background:rgba(232,126,126,0.1); }

    /* ASR mic button */
    .btn-asr { min-width:2.2rem; text-align:center; }
    .btn-asr.asr-ok    { color:#7ec8a0; border-color:#7ec8a0; background:rgba(126,200,160,0.1); }
    .btn-asr.asr-close { color:#e8c97e; border-color:#e8c97e; background:rgba(232,201,126,0.1); }
    .btn-asr.asr-bad   { color:#e87e7e; border-color:#e87e7e; background:rgba(232,126,126,0.1); }
    .btn-asr.asr-busy  { color:#7eb8e8; border-color:#7eb8e8; animation:pulse-asr 0.9s infinite; }
    @keyframes pulse-asr {
      0%,100% { box-shadow:0 0 0 0 rgba(126,184,232,0.5); }
      50%      { box-shadow:0 0 0 5px rgba(126,184,232,0); }
    }

    .state-msg { max-width:1200px; margin:4rem auto; padding:0 2rem; text-align:center; color:var(--muted); font-size:0.95rem; }
    .state-msg .icon { font-size:2.5rem; display:block; margin-bottom:0.6rem; }
  </style>
</head>

<script>
  let allWords = [];

  async function loadVocab() {
    try {
      const resp = await fetch('vocab.json?t=' + Date.now());
      if (!resp.ok) throw new Error('not found');
      allWords = await resp.json();
      buildCategoryFilter();
      applyFilters();
    } catch {
      document.getElementById('card-grid').innerHTML = '';
      document.getElementById('state-msg').innerHTML =
        '<span class="icon">📭</span>No vocabulary yet.<br><small>Add words in Admin and click <strong>Publish to Site</strong>.</small>';
      document.getElementById('state-msg').style.display = 'block';
    }
  }

  function buildCategoryFilter() {
    const cats = [...new Set(allWords.map(w => w.category).filter(Boolean))].sort();
    const sel = document.getElementById('filter-cat');
    cats.forEach(c => {
      const o = document.createElement('option');
      o.value = c; o.textContent = c.charAt(0).toUpperCase() + c.slice(1);
      sel.appendChild(o);
    });
  }

  function applyFilters() {
    const q    = document.getElementById('search-input').value.trim().toLowerCase();
    const cefr = document.getElementById('filter-cefr').value;
    const pos  = document.getElementById('filter-pos').value;
    const cat  = document.getElementById('filter-cat').value;
    const filtered = allWords.filter(w => {
      if (cefr && w.cefr_level !== cefr) return false;
      if (pos  && w.part_of_speech !== pos) return false;
      if (cat  && w.category !== cat) return false;
      if (q    && !w.word.toLowerCase().includes(q)) return false;
      return true;
    });
    renderCards(filtered);
    document.getElementById('count-label').textContent =
      filtered.length + ' word' + (filtered.length !== 1 ? 's' : '');
  }

  function renderCards(words) {
    const grid = document.getElementById('card-grid');
    const msg  = document.getElementById('state-msg');
    if (!words.length) {
      grid.innerHTML = '';
      msg.innerHTML = '<span class="icon">🔍</span>No words match your filter.';
      msg.style.display = 'block';
      return;
    }
    msg.style.display = 'none';
    grid.innerHTML = words.map(w => {
      const catTag   = w.category ? `<span class="tag-cat">${esc(w.category)}</span>` : '';
      const examTags = (w.exam_tags || '').split(',').filter(Boolean).map(t => `<span class="tag-exam exam-${esc(t)}">${esc(t)}</span>`).join('');
      const imgFront = w.image_url ? `<img class="card-img" src="${esc(w.image_url)}" alt="${esc(w.word)}" loading="lazy" onerror="this.style.display='none'">` : '';
      const imgBack  = w.image_url ? `<img src="${esc(w.image_url)}" alt="" style="width:100%;height:65px;object-fit:cover;border-radius:6px;margin-bottom:0.4rem;border:1px solid var(--border);flex-shrink:0" loading="lazy" onerror="this.style.display='none'">` : '';
      const exBack   = w.example ? `<div class="back-example">"${esc(w.example)}"</div>` : `<div class="back-no-ex">No example sentence</div>`;
      const hasImg   = w.image_url ? ' has-image' : '';
      const wJs      = escJs(w.word);
      const exJs     = escJs(w.example || w.word);
      return `
        <div class="flip-card${hasImg}" onclick="this.classList.toggle('flipped')" title="Click to flip">
          <div class="flip-card-inner">
            <div class="flip-front">
              <div class="card-body">
                ${imgFront}
                <div class="card-word">${esc(w.word)}</div>
                <div class="card-meta">
                  <span class="tag-cefr cefr-${w.cefr_level}">${w.cefr_level}</span>
                  <span class="tag-pos">${esc(w.part_of_speech)}</span>
                  ${catTag}
                  ${examTags}
                </div>
              </div>
              <div class="card-actions">
                <button onclick="event.stopPropagation();speakText('${wJs}',this)">🔊</button>
                <button class="btn-asr" id="asr-${w.id}" onclick="event.stopPropagation();checkSpeech('${wJs}','asr-${w.id}')">🎤</button>
                <div class="sc-wrap">
                  <button class="sc-btn" onclick="event.stopPropagation();markCard(this,'ok')" title="說對了">✓</button>
                  <button class="sc-btn" onclick="event.stopPropagation();markCard(this,'bad')" title="再練習">✗</button>
                </div>
              </div>
            </div>
            <div class="flip-back">
              <div class="card-body">
                ${imgBack}
                <div class="back-pos">${esc(w.part_of_speech)} · ${esc(w.cefr_level)}</div>
                ${exBack}
              </div>
              <div class="card-actions">
                <button onclick="event.stopPropagation();speakText('${exJs}',this)">🔊 Read</button>
              </div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function esc(str)   { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function escJs(str) { return String(str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

  function speakText(text, btn) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    btn.classList.add('reading');
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'en-US';
    utt.rate = parseFloat(document.getElementById('tts-speed')?.value || '0.9');
    utt.onend  = () => btn.classList.remove('reading');
    utt.onerror = () => btn.classList.remove('reading');
    window.speechSynthesis.speak(utt);
  }

  function markCard(btn, cls) {
    btn.closest('.sc-wrap').querySelectorAll('.sc-btn').forEach(b => b.className = 'sc-btn');
    btn.classList.add(cls);
  }

  loadVocab();
</script>

<!-- Whisper in-browser ASR -->
<script>
  const _CDN = 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/';
  let _asr = null, _asrLoading = false;

  function _banner(text, color) {
    const b = document.getElementById('asr-banner'), bi = document.getElementById('asr-banner-text');
    if (!b || !bi) return;
    if (!text) { b.style.display = 'none'; return; }
    bi.textContent = text;
    document.getElementById('asr-banner-inner').style.borderColor = color || 'var(--border)';
    b.style.display = 'block';
  }

  async function _loadASR(btn) {
    if (_asr) return _asr;
    if (_asrLoading) { while (_asrLoading) await new Promise(r => setTimeout(r, 300)); return _asr; }
    _asrLoading = true;
    try {
      _banner('📥 首次使用：下載語音模型中（約 38MB，之後免下載）…');
      btn.textContent = '⏳…';
      const mod = await import(_CDN + 'transformers.min.js');
      mod.env.backends.onnx.wasm.proxy    = false;
      mod.env.backends.onnx.wasm.wasmPaths = _CDN;
      mod.env.useBrowserCache = true;
      _asr = await mod.pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en', {
        progress_callback: p => {
          if (p.status === 'progress') {
            const pct = Math.round(p.progress || 0);
            btn.textContent = pct + '%';
            _banner('📥 下載語音模型 ' + pct + '%…');
          }
        }
      });
      _banner('✅ 語音模型就緒', '#7ec8a0');
      setTimeout(() => _banner(null), 2500);
    } catch(e) {
      _banner('❌ 載入失敗：' + (e.message || e), '#e87e7e');
      console.error('ASR load:', e);
      throw e;
    } finally { _asrLoading = false; }
    return _asr;
  }

  async function _record(ms) {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    const rec = new MediaRecorder(stream);
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    rec.start();
    await new Promise(r => setTimeout(r, ms));
    rec.stop();
    await new Promise(r => (rec.onstop = r));
    stream.getTracks().forEach(t => t.stop());
    return new Blob(chunks, { type: rec.mimeType });
  }

  async function _toFloat32(blob) {
    const ab  = await blob.arrayBuffer();
    const ctx = new AudioContext({ sampleRate: 16000 });
    const buf = await ctx.decodeAudioData(ab);
    return buf.getChannelData(0);
  }

  function _lev(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({length:m+1}, (_,i) => Array.from({length:n+1}, (__,j) => i===0?j:j===0?i:0));
    for (let i=1;i<=m;i++) for (let j=1;j<=n;j++)
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    return dp[m][n];
  }

  async function checkSpeech(word, btnId) {
    const btn = document.getElementById(btnId);
    if (!btn || btn.dataset.busy === '1') return;
    btn.dataset.busy = '1'; btn.className = 'btn-asr asr-busy';
    try {
      const model = await _loadASR(btn);
      btn.textContent = '🎙…'; _banner('🎙 錄音中，請說出單字…（3.5 秒）');
      const blob = await _record(3500);
      btn.textContent = '⏳'; _banner('⏳ 辨識中…');
      const f32 = await _toFloat32(blob);
      const result = await model(f32, { language:'english', task:'transcribe' });
      _banner(null);
      const heard  = result.text.replace(/[^a-zA-Z\s]/g,'').trim().toLowerCase();
      const target = word.toLowerCase().trim();
      if (heard === target || heard.split(/\s+/).some(w => w === target)) {
        btn.textContent = '✓'; btn.className = 'btn-asr asr-ok';
      } else if (_lev(heard, target) <= 2) {
        btn.textContent = '≈'; btn.className = 'btn-asr asr-close';
      } else {
        btn.textContent = '✗ ' + result.text.trim().replace(/[^\w\s]/g,'').slice(0,8);
        btn.className = 'btn-asr asr-bad';
      }
    } catch(e) {
      console.error('ASR:', e); btn.textContent = '🎤'; btn.className = 'btn-asr';
      if (!document.getElementById('asr-banner-text')?.textContent?.startsWith('❌'))
        _banner('❌ ' + (e.message || String(e)), '#e87e7e');
    }
    btn.dataset.busy = '0';
  }
</script>
</body>
</html>
