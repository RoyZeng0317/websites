<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FileShare - 檔案共享平台</title>
</head>
<body>

    <!-- 會員升級 Modal（僅在點選 15/30 分鐘時出現） -->
    <div id="member-modal" class="member-modal-overlay" hidden>
        <div class="member-modal-card">
            <button id="btn-close-modal" class="btn-close-modal" aria-label="關閉">✕</button>
            <div class="paywall-lock">👑</div>
            <h2>會員專屬時段</h2>
            <p class="paywall-desc">15 分鐘與 30 分鐘選項為付費會員專屬。</p>
            <div class="paywall-steps">
                <div class="paywall-step"><span>1</span><p>點擊下方購買會員</p></div>
                <div class="paywall-step"><span>2</span><p>以 Google 帳號登入並等待開通（24 小時內）</p></div>
            </div>
            <a href="https://www.paypal.com/ncp/payment/EY57YCQ5YP3W8"
               target="_blank" rel="noopener noreferrer"
               class="btn-paypal">💳 購買會員</a>
            <button id="btn-google-signin" class="btn-google-signin">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
                使用 Google 帳號登入
            </button>
            <p class="paywall-status" id="paywall-status"></p>
        </div>
    </div>

    <div class="container">
        <div class="user-bar" id="user-bar" hidden>
            <span class="user-email" id="user-email"></span>
            <button id="btn-signout" class="btn-signout">登出</button>
        </div>

        <header>
            <h1>FileShare</h1>
            <p>安全的一次性檔案共享</p>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="upload">上傳檔案</button>
            <button class="tab" data-tab="upload-link">上傳連結</button>
            <button class="tab" data-tab="download">下載檔案</button>
            <button class="tab" data-tab="download-link">下載連結</button>
        </div>

        <div id="upload-section" class="section active">
            <div class="drop-zone" id="drop-zone">
                <div class="drop-zone-content">
                    <div class="drop-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p>拖曳檔案或資料夾到此處，或 <span class="browse-text">點擊瀏覽</span></p>
                    <p class="file-limit">最大 500MB</p>
                </div>
                <input type="file" id="file-input" hidden>
                <input type="file" id="folder-input" webkitdirectory hidden>
            </div>

            <div class="upload-toggles">
                <button class="upload-toggle active" data-mode="file">選擇檔案</button>
                <button class="upload-toggle" data-mode="folder">選擇資料夾</button>
            </div>

            <div class="file-info" id="file-info" hidden>
                <div class="file-details">
                    <span class="file-name" id="file-name"></span>
                    <span class="file-size" id="file-size"></span>
                </div>
                <button class="btn-remove" id="btn-remove">✕</button>
            </div>

            <div class="timer-section" id="timer-section">
                <label class="timer-label">連結有效時間</label>
                <div class="timer-options">
                    <label class="timer-option">
                        <input type="radio" name="expires_in" value="60" checked>
                        <span>1 分鐘</span>
                    </label>
                    <label class="timer-option">
                        <input type="radio" name="expires_in" value="180">
                        <span>3 分鐘</span>
                    </label>
                    <label class="timer-option">
                        <input type="radio" name="expires_in" value="300">
                        <span>5 分鐘</span>
                    </label>
                    <label class="timer-option">
                        <input type="radio" name="expires_in" value="600">
                        <span>10 分鐘</span>
                    </label>
                    <label class="timer-option timer-member">
                        <input type="radio" name="expires_in" value="900">
                        <span>15 分鐘</span>
                        <span class="member-badge">👑</span>
                    </label>
                    <label class="timer-option timer-member">
                        <input type="radio" name="expires_in" value="1800">
                        <span>30 分鐘</span>
                        <span class="member-badge">👑</span>
                    </label>
                    <label class="timer-option timer-custom">
                        <input type="radio" name="expires_in" value="custom">
                        <span>自訂</span>
                        <input type="number" id="custom-minutes" class="timer-input" min="1" max="30" value="1" disabled>
                        <span class="timer-unit">分鐘（上限 30）</span>
                    </label>
                </div>
            </div>

            <div class="dl-mode-section" id="dl-mode-section">
                <label class="timer-label">下載次數</label>
                <div class="dl-mode-options">
                    <label class="dl-mode-option active" id="mode-onetime">
                        <input type="radio" name="download_mode" value="1" checked>
                        <span>一次性</span>
                    </label>
                    <label class="dl-mode-option" id="mode-unlimited">
                        <input type="radio" name="download_mode" value="0">
                        <span>無限次數</span>
                    </label>
                </div>
                <p class="dl-mode-hint" id="dl-mode-hint">下載一次後連結自動失效</p>
            </div>

            <button class="btn btn-primary" id="btn-upload" disabled>上傳檔案</button>

            <div class="result" id="upload-result" hidden>
                <div class="result-icon success">✓</div>
                <p>檔案上傳成功！</p>
                <div class="countdown-box" id="countdown-box" hidden>
                    <div class="countdown-display" id="countdown-display">
                        <span class="countdown-time" id="countdown-time"></span>
                    </div>
                    <p class="countdown-label">剩餘有效時間</p>
                </div>
                <div class="share-box">
                    <label>分享連結</label>
                    <div class="share-field">
                        <span class="share-url" id="share-url"></span>
                        <button class="btn-copy" id="btn-copy-link">複製連結</button>
                    </div>
                </div>
                <div class="password-box">
                    <label>一次性密碼</label>
                    <div class="password-field">
                        <span id="upload-password"></span>
                        <button class="btn-copy" id="btn-copy">複製</button>
                    </div>
                </div>
                <p class="password-hint">將連結或密碼分享給接收者，僅能使用一次</p>
                <button class="btn btn-danger" id="btn-delete-share">🗑 刪除連結</button>
            </div>

            <div class="result error" id="upload-error" hidden>
                <div class="result-icon error">✕</div>
                <p id="upload-error-msg"></p>
            </div>
        </div>

        <div id="download-section" class="section">
            <div class="password-input-group">
                <label for="download-password">輸入一次性密碼</label>
                <input type="text" id="download-password" placeholder="請輸入密碼" autocomplete="off">
            </div>
            <button class="btn btn-primary" id="btn-download" disabled>下載檔案</button>

            <div class="result error" id="download-error" hidden>
                <div class="result-icon error">✕</div>
                <p id="download-error-msg"></p>
            </div>

            <div class="loading" id="download-loading" hidden>
                <div class="spinner"></div>
                <p>正在下載檔案...</p>
            </div>
        </div>

        <div id="upload-link-section" class="section">
            <div class="password-input-group">
                <label for="link-url">輸入檔案連結</label>
                <input type="url" id="link-url" placeholder="https://example.com/file.zip">
            </div>
            <button class="btn btn-primary" id="btn-upload-link">上傳連結</button>

            <div class="result error" id="upload-link-error" hidden>
                <div class="result-icon error">✕</div>
                <p id="upload-link-error-msg"></p>
            </div>
        </div>

        <div id="download-link-section" class="section">
            <div class="password-input-group">
                <label for="download-link-input">輸入下載連結</label>
                <input type="text" id="download-link-input" placeholder="貼上下載連結">
            </div>
            <button class="btn btn-primary" id="btn-download-link">下載連結</button>

            <div class="result error" id="download-link-error" hidden>
                <div class="result-icon error">✕</div>
                <p id="download-link-error-msg"></p>
            </div>
        </div>
    </div>

    <footer>
        &copy; <a href="https://stellarix-electronics.web.app/" class="link">星元電子科技有限公司</a> 著作所有
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
